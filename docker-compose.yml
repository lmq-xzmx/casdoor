services:
  casdoor:
    image: casbin/casdoor:latest
    restart: always
    ports:
      - "5011:5012"
    environment:
      RUNNING_IN_DOCKER: "true"
    volumes:
      - ./conf/app.conf:/conf/app.conf
      - ./web/build:/frontend
    networks:
      - casdoor-network
    command: /bin/sh -c './server --createDatabase=true'

networks:
  casdoor-network:
    external: true
    name: geo-monitor_geo-network
