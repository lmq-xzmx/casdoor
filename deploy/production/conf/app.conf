appname = casdoor
httpport = 3012
runmode = prod
copyrequestbody = true

# PostgreSQL - 生产数据库
driverName = postgres
dataSourceName = host=${POSTGRES_HOST:-postgres} user=postgres password=${POSTGRES_PASSWORD:-postgres123} dbname=casdoor port=5432 sslmode=disable
dbName = casdoor
tableNamePrefix =
showSql = false

# Redis - 生产缓存
redisEndpoint = ${REDIS_HOST:-redis}:6379

# 静态资源
staticBaseUrl = ""
isCloudIntranet = false

# 认证
authState = "casdoor"
verificationCodeTimeout = 10
initScore = 0
logPostOnly = true
isUsernameLowered = false

# CORS - 根据实际情况修改
origin = "http://localhost:3011"
originFrontend = "http://localhost:3011"

# 生产模式关闭调试功能
isDemoMode = false
showGithubCorner = false

# 日志
logConfig = {"adapter":"file", "filename": "logs/casdoor.log", "maxdays":30, "perm":"0770"}

# 前端
defaultLanguage = "en"
defaultApplication = "app-built-in"
enableGzip = true

# 配额
quota = {"organization": -1, "user": -1, "application": -1, "provider": -1}

# 其他端口
ldapServerPort = 389
ldapsCertId = ""
ldapsServerPort = 636
radiusServerPort = 1812
radiusDefaultOrganization = "built-in"
radiusSecret = "${RADIUS_SECRET:-secret}"
